name: Build and Release

on:
  push:
    tags: [ "v*.*.*" ]
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install toolchains
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv
          uv sync --group dev
          npm install --no-audit --no-fund

      - name: Collect changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          git diff --name-only --diff-filter=ACMR "$BASE" "$HEAD" > changed.txt || true
          echo "py=$(grep -E '\.py$' changed.txt | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "js=$(grep -E '\.js$' changed.txt | grep -vE 'static/libs/|static/ext/|eslint.config.js' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Ruff (changed Python files)
        if: steps.changed.outputs.py != ''
        run: uv run ruff check ${{ steps.changed.outputs.py }}

      - name: ESLint (changed JavaScript files)
        if: steps.changed.outputs.js != ''
        run: npx eslint ${{ steps.changed.outputs.js }}

  test:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv
          uv sync

      - name: Contract tests
        run: uv run pytest tests

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv venv
          uv sync

      - name: Install Node.js dependencies
        run: npm install

      - name: Build Python backend
        run: |
          uv add pyinstaller
          uv run pyinstaller server.spec

      - name: Build and Publish Electron app
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest)
              npx electron-builder build --win --publish never
              ;;
            ubuntu-latest)
              npx electron-builder build --linux --publish never
              ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false