    "nest-asyncio>=1.6.0",
    "odfpy>=1.4.1",
    "openai>=1.76.0",
    "openpyxl>=3.1.5",
    "pypdf2>=3.0.1",
    "python-a2a[all]>=0.5.6",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0.2",
    "pywin32>=310 ; sys_platform == 'win32'",
    "rank-bm25>=0.2.2",
    "requests>=2.32.3",
    "shortuuid>=1.0.13",
    "slixmpp>=1.10.0",
    "striprtf>=0.0.29",
    "tavily-python>=0.7.0",
    "tzlocal>=5.3.1",
    "uvicorn[standard]>=0.34.2",
    "mem0ai==1.0.0",
    "e2b-code-interpreter>=1.5.0",
    "qq-botpy>=1.2.1",
    "duckduckgo-search>=8.0.3",
    "langchain-google-community>=2.0.7",
    "langchain-exa>=0.3.0",
    "ollama>=0.5.1",
    "scipy>=1.16.0",
    "edge-tts>=7.0.2",
    "brotli>=1.1.0",
    "wikipedia-api>=0.8.1",
    "arxiv>=2.2.0",
    "anyio>=4.9.0",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    # S85-D：socks 代理全链路支持（requests=httpx 走 pysocks/socksio，aiohttp 走 aiohttp-socks）
    "pysocks>=1.7.1",
    "socksio>=1.0.0",
    "aiohttp-socks>=0.10.0",
    "ddgs>=9.5.4",
    "aiofiles>=25.1.0",
    "sherpa-onnx>=1.12.19",
    "soundfile>=0.13.1",
    "nvidia-ml-py>=13.580.82",
    "pip-licenses>=5.5.0",
    "google-api-python-client>=2.179.0",
    "lark-oapi>=1.4.24",
    "pydub>=0.25.1",
    "imageio-ffmpeg>=0.6.0",
    "discord-py>=2.6.4",
    "pyinstaller>=6.17.0",
    # S82(C1)：onnxruntime 按平台拆分（win=DirectML 加速 MOSS-TTS/minilm，mac=CPU，linux 非 arm=GPU）
    "onnxruntime>=1.24.0 ; sys_platform == 'darwin'",
    "onnxruntime-directml>=1.24.0 ; sys_platform == 'win32'",
    "onnxruntime-gpu>=1.24.0 ; sys_platform != 'darwin' and sys_platform != 'win32' and platform_machine != 'aarch64'",
    "onnxruntime>=1.24.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "transformers>=4.57.3",
    "pyttsx3>=2.99",
    "xlrd>=2.0.2",
    "tetos>=0.4.2",
    "langchain-classic>=1.0.1",
    "slack-sdk>=3.39.0",
    "dingtalk-stream>=0.24.3",
    "pyautogui>=0.9.54",
    # S139(R6)：灵动岛媒体控制（上游 dep 行逐字：win=SMTC/winrt 状态+pycaw 音量，linux=jeepney MPRIS；mac 走 osascript 无依赖）
    "jeepney>=0.8.0 ; sys_platform == 'linux'",
    "pycaw>=20240210 ; sys_platform == 'win32'",
    "winrt-windows-media-control>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=3.2.1 ; sys_platform == 'win32'",
    "elevenlabs>=2.41.0",
    "litellm>=1.83.7",
    "wecom-aibot-python-sdk>=1.0.2",
    "wechatbot-sdk>=0.2.0",
    "qrcode>=8.2",
    "sentencepiece>=0.2.1",
    "huggingface-hub>=1.7.1",
    "modelscope>=1.35.4",
    "pillow>=12.2.0",
    "pyasn1>=0.6.3",
    "lxml>=6.1.0",
    "langchain-core>=1.2.28",
    # S91(THA)：桌宠 JPEG 编码 + macOS CoreML 引擎（win/linux 安装不受影响）
    "simplejpeg>=1.7.6",
    "coremltools>=8.0 ; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    # RA-38（S66）：钉 0.17 系——lint 归零判定版本敏感（全局旧版对上游 behavior_engine 报 F811）
    "ruff==0.17.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "-q"

# --- M-2 静态检查（ruff）：最小实用集 = pyflakes 错误(F) + 明显风格错误(E4/E7/E9) + 复杂度门(C901) ---
# 复杂度上限=存量基线（只防恶化，不做历史清账）；新增/改动文件必须零告警（CI 对 diff 文件全量把关）
[tool.ruff]
target-version = "py312"
line-length = 140
# 项目显式配置存在即阻断对上级/用户全局 ruff 配置的向上搜索

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 60

# M-2 legacy baseline: existing violations are grandfathered per file/rule;
# deleting an entry (after cleaning that class in that file) re-enables the gate.
[tool.ruff.lint.per-file-ignores]
"py/ClaudeAsOpenAI.py" = ["F401"]
"py/acpx_tools.py" = ["F541"]
"py/agent.py" = ["E722", "F401"]
"py/behavior_engine.py" = ["E701", "E722", "F401"]
