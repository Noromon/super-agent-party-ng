license = "AGPL-3.0"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11.18",
    "aiosqlite>=0.21.0",
    "appdirs>=1.4.4",
    "bs4>=0.0.2",
